<style>
/* Layout: Seitenleiste + Arbeitsfläche (Liste | Detail) ab Tablet-Breite, unten Tab-Leiste auf schmalen Geräten. Kochmodus mit großer, aus Distanz lesbarer Schrift. */

:root[data-theme="dark"] {

* { box-sizing: border-box; }

function parseQty(tok) {
  if (!tok) return null;
  if (FRAC[tok] != null) return FRAC[tok];
  let m = tok.match(/^(\d+)([½¼¾⅓⅔])$/); if (m) return +m[1] + FRAC[m[2]];
  m = tok.match(/^(\d+)\/(\d+)$/); if (m) return +m[2] ? +m[1] / +m[2] : null;
  m = tok.match(/^\d+(?:[.,]\d+)?$/); if (m) return parseFloat(tok.replace(",", "."));
  return null;
}
function parseIng(line) {
  const s = line.trim();
  if (!s) return null;
  if (/:$/.test(s)) return { section: true, name: s.slice(0, -1).trim() };
  const parts = s.split(/\s+/);
  let qty = parseQty(parts[0]), i = qty != null ? 1 : 0;
  if (qty != null && parts[1] && FRAC[parts[1]] != null) { qty += FRAC[parts[1]]; i++; }
  let unit = "";
  if (parts[i]) {
    const cand = parts[i].replace(/\.$/, "");
    const hit = UNITS.find(u => u.toLowerCase() === cand.toLowerCase());
    if (hit && parts.length > i + 1) { unit = hit; i++; }
  }
  return { qty, unit, name: parts.slice(i).join(" ") };
}
function fmtQty(n) {
  if (n == null || isNaN(n)) return "";
  const r = n >= 100 ? Math.round(n / 5) * 5 : n >= 10 ? Math.round(n) : Math.round(n * 100) / 100;
  const whole = Math.floor(r), frac = Math.round((r - whole) * 100) / 100;
  const sym = { .25: "¼", .5: "½", .75: "¾", .33: "⅓", .67: "⅔" }[frac];
  if (sym && r < 10) return (whole ? whole : "") + sym;
  return r.toLocaleString("de-DE", { maximumFractionDigits: r < 1 ? 2 : 1 });
}
const ingLine = i => i.section ? i.name + ":" : [fmtQty(i.qty), i.unit, i.name].filter(Boolean).join(" ");

function timersIn(text) {
  const out = []; const re = /(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*(\d+(?:[.,]\d+)?))?\s*(Minuten|Minute|Min\.?|Std\.?|Stunden|Stunde|Sek\.?|Sekunden)(?![a-zäöü])/gi;
  let m;
  while ((m = re.exec(text))) {
    const v = parseFloat((m[2] || m[1]).replace(",", "."));
    const u = m[3].toLowerCase();
    const sec = u.startsWith("st") ? v * 3600 : u.startsWith("sek") ? v : v * 60;
    if (sec > 0 && sec <= 86400) out.push({ label: m[0].trim(), sec });
  }
  return out;
}

/* ---------- Datenhaltung ---------- */
let db = null;
const pending = new Map();   // pfad -> {timer, data}
const chains = new Map();

function writeDoc(path, data, delay = 0) {
  if (S.mode !== "db") { persistLocal(); return; }
  const p = pending.get(path) || {};
  clearTimeout(p.timer);
  p.data = data;
  p.timer = setTimeout(() => flush(path), delay);
  pending.set(path, p);
}
function flush(path) {
  const p = pending.get(path); if (!p) return;
  pending.delete(path);
  const prev = chains.get(path) || Promise.resolve();
  const next = prev.then(() => (p.data === null ? db.doc(path).delete() : db.doc(path).set(p.data)))
    .catch(e => {
      if (e && e.code === "quota_exceeded") toast("Speicher voll – bitte alte Einträge löschen.");
      else if (e && e.code === "invalid_argument") toast("Speichern nicht erlaubt: Du hast hier nur Leserechte.");
      else toast("Speichern fehlgeschlagen. Prüfe die Verbindung.");
    });
  chains.set(path, next);
}
function persistLocal() {
  clearTimeout(persistLocal.t);
  persistLocal.t = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ recipes: S.recipes, menus: S.menus, shopping: S.shopping, progress: S.progress })); } catch (e) {}
  }, 200);
}

const Data = {
  putRecipe(r) { r.updatedAt = now(); upsert(S.recipes, r); writeDoc("recipes/" + r.id, r, 0); },
  delRecipe(id) { S.recipes = S.recipes.filter(x => x.id !== id); writeDoc("recipes/" + id, null); },
  putMenu(m, delay = 0) { m.updatedAt = now(); upsert(S.menus, m); writeDoc("menus/" + m.id, m, delay); },
  delMenu(id) { S.menus = S.menus.filter(x => x.id !== id); writeDoc("menus/" + id, null); },
  putShopping() { writeDoc("lists/shopping", { items: S.shopping.items, updatedAt: now() }, 400); },
  putProgress(key) { writeDoc("progress/" + key, S.progress[key] ? Object.assign(S.progress[key], { updatedAt: now() }) : null, 400); },
};
function upsert(arr, obj) { const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }

function applyCollection(name, snap) {
  const local = new Map(S[name].map(x => [x.id, x]));
  const out = [];
  for (const d of snap.docs) {
    const p = pending.get(name + "/" + d.id);
    if (p) { if (p.data !== null) out.push(local.get(d.id) || { ...clone(d.data()), id: d.id }); }
    else out.push({ ...clone(d.data()), id: d.id });
  }
  for (const [id, x] of local) {
    const p = pending.get(name + "/" + id);
    if (p && p.data !== null && !out.some(o => o.id === id)) out.push(x);
  }
  return out;
}

async function initData() {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) {
    S.mode = "local";
    try {
      const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (saved) Object.assign(S, { recipes: saved.recipes || [], menus: saved.menus || [], shopping: saved.shopping || { items: [] }, progress: saved.progress || {} });
    } catch (e) {}
    S.loaded = true; render(); return;
  }
  S.mode = "db";
  let got = 0; const done = () => { if (++got >= 4 && !S.loaded) { S.loaded = true; } render(); };
  const onErr = () => toast("Verbindung zur Datenbank unterbrochen. Lade die Seite neu.");
  db.collection("recipes").onSnapshot(s => { S.recipes = applyCollection("recipes", s); done(); }, onErr);
  db.collection("menus").onSnapshot(s => { S.menus = applyCollection("menus", s); done(); }, onErr);
  db.collection("progress").onSnapshot(s => {
    const out = {};
    for (const d of s.docs) out[d.id] = pending.has("progress/" + d.id) && S.progress[d.id] ? S.progress[d.id] : clone(d.data());
    for (const k in S.progress) if (pending.has("progress/" + k) && pending.get("progress/" + k).data) out[k] = S.progress[k];
    S.progress = out; done();
  }, onErr);
  db.doc("lists/shopping").onSnapshot(s => {
    if (!pending.has("lists/shopping")) S.shopping = s.exists ? { items: clone(s.data().items || []) } : { items: [] };
    done();
  }, onErr);
}

/* ---------- Display wach halten ---------- */
let wakeLock = null, wantWake = false, wakeState = "off";
async function wakeOn() {
  wantWake = true;
  if (!("wakeLock" in navigator)) { wakeState = "unsupported"; renderNav(); toast("Dieser Browser kann das Display nicht wach halten."); return; }
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeState = "on";
    wakeLock.addEventListener("release", () => { wakeLock = null; if (wantWake) wakeState = "paused"; renderNav(); });
  } catch (e) { wakeState = "denied"; toast("Display-Sperre konnte nicht verhindert werden."); }

}
function wakeOff() { wantWake = false; wakeState = "off"; if (wakeLock) wakeLock.release().catch(() => {}); wakeLock = null; renderNav(); }

/* ---------- Timer ---------- */
let timers = []; let audio = null;
function startTimer(label, sec, ctx) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
  timers.push({ id: uid(), label: ctx ? ctx + " · " + label : label, end: Date.now() + sec * 1000, rung: false });
  renderTimers();
}
function beep() {
  if (!audio) return;
  try {
    for (let k = 0; k < 3; k++) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime + k * 0.35;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.start(t); o.stop(t + 0.3);
    }
  } catch (e) {}
}
function fmtLeft(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}
function timersHtml() {
  return timers.map(t => {
    const left = t.end - Date.now();
    return `<span class="timer${left <= 0 ? " ring" : ""}" data-timer="${t.id}"><span>${esc(t.label)}</span> <b class="left">${left <= 0 ? "Fertig!" : fmtLeft(left)}</b><button data-action="timer-stop" data-id="${t.id}" aria-label="Timer beenden">×</button></span>`;
  }).join("");
}
function renderTimers() { const el = $("#timers"); if (el) el.innerHTML = timersHtml(); }
setInterval(() => {
  if (!timers.length) return;
  let changed = false;
  for (const t of timers) {
    if (!t.rung && t.end <= Date.now()) { t.rung = true; changed = true; beep(); toast("Timer fertig: " + t.label); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  }
  const el = $("#timers");
  if (!el) return;
  if (changed || el.children.length !== timers.length) { renderTimers(); return; }
  for (const t of timers) { const b = el.querySelector(`[data-timer="${t.id}"] .left`); if (b && !t.rung) b.textContent = fmtLeft(t.end - Date.now()); }
}, 1000);

/* ---------- Einkaufsliste ---------- */
function addToShopping(ings, factor, from) {
  let added = 0;
  for (const i of ings) {
    if (i.section || !i.name) continue;
    const qty = i.qty != null ? i.qty * factor : null;
    const key = shopKey(i.name, i.unit);
    const ex = S.shopping.items.find(x => !x.done && shopKey(x.name, x.unit) === key);
    if (ex) {
      if (ex.qty != null && qty != null) ex.qty += qty; else if (ex.qty == null) ex.qty = qty;
      if (from && !(ex.from || []).includes(from)) ex.from = [...(ex.from || []), from];
    } else {
      S.shopping.items.push({ id: uid(), name: i.name, unit: normUnit(i.unit), qty, done: false, from: from ? [from] : [] });
    }
    added++;
  }
  Data.putShopping();
  return added;
}

    ${S.menus.length ? `<div class="chips" style="margin-bottom:18px;align-items:center"><span class="muted" style="font-size:.88rem">Aus Menü übernehmen:</span>${S.menus.map(m => `<button class="chip" data-action="menu-to-shop" data-id="${m.id}">${esc(m.name || "Menü")}</button>`).join("")}</div>` : ""}

    ${done.length ? `<div class="view-head section-label"><h3 class="grow">Erledigt</h3><button class="btn sm" data-action="shop-clear-done">Erledigte entfernen</button></div><ul class="shop-list">${done.map(row).join("")}</ul>` : ""}

/* ---------- Kochmodus ---------- */
function cookTarget() {
  if (!S.cook) return null;
  if (S.cook.kind === "menu") {
    const m = byId(S.menus, S.cook.id); if (!m) return null;
    const parts = (m.courses || []).map((c, i) => ({ key: "c" + i, recipe: byId(S.recipes, c.recipeId), servings: +m.guests || null, course: c.course })).filter(p => p.recipe);
    return { title: m.name || "Menü", sub: [m.date ? fmtDate(m.date) : "", m.guests ? m.guests + " Personen" : ""].filter(Boolean).join(" · "), pkey: "m-" + m.id, parts };
  }
  const r = byId(S.recipes, S.cook.id); if (!r) return null;
  const sv = S.cook.servings || r.servings;
  return { title: r.title, sub: sv ? sv + " Portionen" : "", pkey: "r-" + r.id, parts: [{ key: "c0", recipe: r, servings: sv, course: r.category }] };
}
function prog(pkey) { return S.progress[pkey] || { s: {}, i: {} }; }

function viewCook() {
  const t = cookTarget();
  if (!t) {
    return `<div class="view">
      <div class="view-head"><div class="grow"><div class="eyebrow">Kochmodus</div><h1>Was kochst du?</h1></div></div>
      <p class="muted" style="max-width:60ch;margin-top:-8px">Wähle ein Menü oder Rezept. Im Kochmodus hakst du Zutaten und Schritte ab, startest Timer direkt aus den Schritten und das Display bleibt an.</p>
      ${S.menus.length ? `<h3 class="section-label">Menüs</h3><div class="pick-grid">${S.menus.map(m => `<button class="m-card" data-action="cook-menu" data-id="${m.id}"><span class="t">${esc(m.name || "Menü")}</span><span class="muted">${(m.courses || []).length} Gänge${m.guests ? " · " + m.guests + " Pers." : ""}</span></button>`).join("")}</div>` : ""}
      ${S.recipes.length ? `<h3 class="section-label">Einzelne Rezepte</h3><div class="pick-grid">${filteredRecipes().map(r => `<button class="m-card" data-action="cook-recipe" data-id="${r.id}"><span class="t">${esc(r.title)}</span><span class="muted">${esc(recipeMeta(r))}</span></button>`).join("")}</div>` : `<div class="panel empty"><h2>Noch nichts zu kochen</h2><p>Lege zuerst ein Rezept an.</p><button class="btn primary" data-action="nav" data-view="recipes">Zu den Rezepten</button></div>`}
    </div>`;
  }
  const p = prog(t.pkey);
  let total = 0, doneN = 0;
  for (const part of t.parts) { const n = (part.recipe.steps || []).length; total += n; doneN += ((p.s || {})[part.key] || []).filter(x => x < n).length; }
  const tabIdx = Math.min(S.cook.tab || 0, t.parts.length - 1);
  const part = t.parts[tabIdx];
  const r = part.recipe, f = scaleFactor(r, part.servings);
  const sDone = new Set((p.s || {})[part.key] || []), iDone = new Set((p.i || {})[part.key] || []);
  const next = (r.steps || []).findIndex((_, i) => !sDone.has(i));
  const armed = S.armed === "cook-reset";
  const pct = total ? Math.round(doneN / total * 100) : 0;
  let stepNo = 0;
  return `<div class="view cook">
    <div class="cook-head">
      <div class="cook-top">
        <div class="grow"><div class="eyebrow">Kochmodus${t.sub ? " · " + esc(t.sub) : ""}</div><h1>${esc(t.title)}</h1></div>
        <span class="num muted" style="font-weight:700">${doneN}/${total} Schritte</span>
        <button class="btn sm ghost${armed ? " danger armed" : ""}" data-action="cook-reset">${armed ? "Zurücksetzen?" : "Zurücksetzen"}</button>
        <button class="btn sm" data-action="cook-exit">Beenden</button>
      </div>
      <div class="progress" aria-label="Fortschritt ${pct} %"><i style="width:${pct}%"></i></div>
      ${t.parts.length > 1 ? `<div class="tabs" role="tablist">${t.parts.map((pt, i) => {
        const n = (pt.recipe.steps || []).length, d = ((p.s || {})[pt.key] || []).filter(x => x < n).length;
        return `<button class="tab${n && d >= n ? " complete" : ""}" role="tab" aria-selected="${i === tabIdx}" data-action="cook-tab" data-i="${i}"><small>${esc(pt.course || "")}</small>${esc(pt.recipe.title)} <small class="num">${d}/${n}</small></button>`;
      }).join("")}</div>` : ""}
      <div class="timers" id="timers">${timersHtml()}</div>
    </div>
    <div class="cook-cols">
      <section>
        <h2>Zutaten${part.servings ? ` <span class="muted num" style="font-size:.95rem;font-weight:400">für ${part.servings}</span>` : ""}</h2>
        <ul class="check-list">${(r.ingredients || []).map((i, idx) => i.section
          ? `<li class="eyebrow" style="margin-top:8px">${esc(i.name)}</li>`
          : `<li><button class="check ing${iDone.has(idx) ? " is-done" : ""}" data-action="cook-ing" data-idx="${idx}" aria-pressed="${iDone.has(idx)}"><span class="box">${icon("check")}</span><span class="txt"><b class="num">${esc([fmtQty(i.qty != null ? i.qty * f : null), i.unit].filter(Boolean).join(" "))}</b> ${esc(i.name)}</span></button></li>`).join("")}</ul>
      </section>
      <section>
        <h2>Schritte</h2>
        <ol class="check-list">${(r.steps || []).map((s, idx) => {
          stepNo++;
          const tm = timersIn(s);
          return `<li><div class="check${sDone.has(idx) ? " is-done" : ""}${idx === next ? " next" : ""}" id="step-${idx}">
            <button class="box" data-action="cook-step" data-idx="${idx}" aria-pressed="${sDone.has(idx)}" aria-label="Schritt ${stepNo} erledigt">${icon("check")}</button>
            <span class="txt" data-action="cook-step" data-idx="${idx}"><span class="no">${stepNo}</span>${esc(s)}
            ${tm.length && !sDone.has(idx) ? `<br>${tm.map(x => `<button class="timer-btn" data-action="timer-start" data-sec="${x.sec}" data-label="${esc(x.label)}">${icon("clock")}${esc(x.label)} starten</button>`).join(" ")}` : ""}</span>
          </div></li>`;
        }).join("") || '<li class="muted">Keine Schritte eingetragen.</li>'}</ol>
        ${total && doneN >= total ? `<div class="notes" style="margin-top:20px;background:var(--accent-soft)"><b>Alles erledigt.</b> Guten Appetit! Wie war's? Hinterlass einen Kommentar am Rezept.</div>` : ""}
      </section>
    </div>
  </div>`;
}
function toggleProgress(kind, idx) {
  const t = cookTarget(); if (!t) return;
  const part = t.parts[Math.min(S.cook.tab || 0, t.parts.length - 1)];
  const p = S.progress[t.pkey] = S.progress[t.pkey] || { s: {}, i: {} };
  p[kind] = p[kind] || {};
  const arr = new Set(p[kind][part.key] || []);
  const turnedOn = !arr.has(idx);
  turnedOn ? arr.add(idx) : arr.delete(idx);
  p[kind][part.key] = [...arr].sort((a, b) => a - b);
  Data.putProgress(t.pkey);
  render();
  if (kind === "s" && turnedOn) {
    const nx = $(".check.next");
    if (nx) nx.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  }
}
function startCook(kind, id, servings) {
  S.cook = { kind, id, tab: 0, servings: servings || null };
  saveUi();
  S.view = "cook";
  if (!wantWake) wakeOn();
  render();
  $("main").scrollTop = 0;
}

/* ---------- Rendering ---------- */
function render() {
  renderNav();
  const main = $("#main");
  if (!S.loaded) return;
  const active = document.activeElement;
  const keep = active && active.id && main.contains(active) ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
  const drafts = {};
  main.querySelectorAll("textarea[id], input[id]").forEach(el => { if (el.id === "comment-input" || el.id === "shop-new") drafts[el.id] = el.value; });
  const scroll = main.scrollTop;
  main.innerHTML = { recipes: viewRecipes, menus: viewMenus, shopping: viewShopping, cook: viewCook }[S.view]();
  for (const id in drafts) { const el = document.getElementById(id); if (el) el.value = drafts[id]; }
  main.scrollTop = scroll;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
}

/* ---------- Ereignisse ---------- */
function disarmLater() { clearTimeout(disarmLater.t); disarmLater.t = setTimeout(() => { if (S.armed) { S.armed = null; render(); } }, 4000); }
function armOr(key, fn) { if (S.armed === key) { S.armed = null; fn(); } else { S.armed = key; disarmLater(); } render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const recipe = id && byId(S.recipes, id);
  switch (a) {
    case "nav": S.view = el.dataset.view; S.armed = null; render(); $("main").scrollTop = 0; break;
    case "wake": wakeState === "on" || wantWake ? wakeOff() : wakeOn(); break;
    case "new-recipe": openEditor(null); break;
    case "edit-recipe": openEditor(recipe); break;
    case "close-overlay": closeOverlay(); break;
    case "open-recipe": S.selRecipe = id; render(); if (innerWidth <= 1080) $("main").scrollTop = 0; break;
    case "close-recipe": S.selRecipe = null; render(); break;
    case "cat": S.cat = el.dataset.cat; render(); break;
    case "rate": {
      const r = clone(byId(S.recipes, S.selRecipe)); const v = +el.dataset.v;
      r.rating = r.rating === v ? 0 : v; Data.putRecipe(r); render(); break;
    }
    case "serv": {
      const cur = S.serv[id] || recipe.servings || 1;
      S.serv[id] = Math.max(1, Math.min(99, cur + +el.dataset.d)); render(); break;
    }
    case "del-recipe": armOr("del-recipe-" + id, () => { Data.delRecipe(id); S.selRecipe = null; toast("Rezept gelöscht"); }); break;
    case "del-comment": {
      const r = clone(recipe); r.comments = (r.comments || []).filter(c => c.id !== el.dataset.cid); Data.putRecipe(r); render(); break;
    }
    case "recipe-to-shop": {
      const serv = S.serv[id] || recipe.servings;
      const n = addToShopping(recipe.ingredients || [], scaleFactor(recipe, serv), recipe.title);
      render(); toast(`${n} Zutaten auf die Einkaufsliste gesetzt`); break;
    }
    case "cook-recipe": startCook("recipe", id, S.serv[id]); break;
    case "cook-menu": startCook("menu", id); break;
    case "new-menu": { const m = newMenu(); S.selMenu = m.id; render(); setTimeout(() => { const n = $("#menu-name"); if (n) { n.focus(); n.select(); n.scrollIntoView({ block: "center" }); } }, 30); break; }
    case "open-menu": S.selMenu = id; render(); setTimeout(() => { const ed = $("#menu-editor"); if (ed) ed.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30); break;
    case "del-menu": armOr("del-menu-" + id, () => { Data.delMenu(id); S.selMenu = null; toast("Menü gelöscht"); }); break;
    case "course-move": case "course-del": {
      const m = clone(byId(S.menus, S.selMenu)); const i = +el.dataset.idx;
      if (a === "course-del") m.courses.splice(i, 1);
      else { const j = i + +el.dataset.d; if (j < 0 || j >= m.courses.length) break; [m.courses[i], m.courses[j]] = [m.courses[j], m.courses[i]]; }
      Data.putMenu(m); render(); break;
    }
    case "menu-to-shop": {
      const m = byId(S.menus, id); let n = 0;
      for (const c of m.courses || []) { const r = byId(S.recipes, c.recipeId); if (r) n += addToShopping(r.ingredients || [], scaleFactor(r, +m.guests), r.title); }
      render(); toast(`${n} Zutaten aus „${m.name || "Menü"}“ übernommen`); break;
    }
    case "shop-toggle": { const it = S.shopping.items.find(x => x.id === id); if (it) { it.done = !it.done; Data.putShopping(); render(); } break; }
    case "shop-clear-done": S.shopping.items = S.shopping.items.filter(x => !x.done); Data.putShopping(); render(); break;
    case "shop-clear": armOr("shop-clear", () => { S.shopping.items = []; Data.putShopping(); }); break;
    case "shop-copy": {
      const txt = S.shopping.items.filter(i => !i.done).map(i => "• " + [fmtQty(i.qty), i.unit, i.name].filter(Boolean).join(" ")).join("\n");
      const ok = () => toast("Liste kopiert – z. B. in Erinnerungen einfügen");
      try { navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt)); } catch (err) { fallbackCopy(txt); }
      break;
    }
    case "cook-tab": S.cook.tab = +el.dataset.i; saveUi(); render(); $("main").scrollTop = 0; break;
    case "cook-ing": toggleProgress("i", +el.dataset.idx); break;
    case "cook-step": if (e.target.closest(".timer-btn")) break; toggleProgress("s", +el.dataset.idx); break;
    case "cook-reset": armOr("cook-reset", () => { const t = cookTarget(); if (t) { S.progress[t.pkey] = { s: {}, i: {} }; Data.putProgress(t.pkey); } }); break;
    case "cook-exit": S.cook = null; saveUi(); render(); break;
    case "timer-start": e.stopPropagation(); startTimer(el.dataset.label, +el.dataset.sec, cookTarget() && cookTarget().parts.length > 1 ? (cookTarget().parts[S.cook.tab || 0] || {}).recipe.title : ""); toast("Timer gestartet: " + el.dataset.label); break;
    case "timer-stop": timers = timers.filter(t => t.id !== id); renderTimers(); break;
  }
});
function fallbackCopy(txt) {
  const ov = $("#overlay");
  ov.innerHTML = `<div class="dialog"><h2>Liste zum Kopieren</h2><textarea class="input" id="copy-area" rows="12" readonly>${esc(txt)}</textarea><div class="dialog-foot"><button class="btn primary" data-action="close-overlay">Fertig</button></div></div>`;
  ov.hidden = false; const ta = $("#copy-area"); ta.focus(); ta.select();
}

document.addEventListener("input", e => {
  if (e.target.dataset.input === "q") { S.q = e.target.value; render(); }
});
document.addEventListener("change", e => {
  const el = e.target, c = el.dataset.change;
  if (!c) return;
  if (c === "sort") { S.sort = el.value; saveUi(); render(); }
  else if (c === "add-to-menu") {
    const r = byId(S.recipes, el.dataset.id); if (!el.value || !r) return;
    if (el.value === "__new") { const m = newMenu(r); S.view = "menus"; S.selMenu = m.id; render(); toast("Neues Menü mit „" + r.title + "“ angelegt"); }
    else { const m = clone(byId(S.menus, el.value)); m.courses = m.courses || []; m.courses.push({ recipeId: r.id, course: guessCourse(r) }); Data.putMenu(m); render(); toast("Zu „" + (m.name || "Menü") + "“ hinzugefügt"); }
  }
  else if (c === "menu-field") {
    const m = clone(byId(S.menus, S.selMenu)); const f = el.dataset.field;
    m[f] = f === "guests" ? Math.max(1, parseInt(el.value, 10) || 1) : el.value.trim();
    Data.putMenu(m); render();
  }
  else if (c === "course") {
    const m = clone(byId(S.menus, S.selMenu)); m.courses[+el.dataset.idx][el.dataset.field] = el.value; Data.putMenu(m); render();
  }
  else if (c === "course-add") {
    const r = byId(S.recipes, el.value); if (!r) return;
    const m = clone(byId(S.menus, S.selMenu)); m.courses = m.courses || []; m.courses.push({ recipeId: r.id, course: guessCourse(r) }); Data.putMenu(m); render();
  }
});
document.addEventListener("submit", e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === "recipe") saveEditor();
  else if (f === "comment") {
    const ta = $("#comment-input"); const txt = ta.value.trim(); if (!txt) return;
    const r = clone(byId(S.recipes, e.target.dataset.id)); r.comments = [...(r.comments || []), { id: uid(), text: txt, at: now() }];
    ta.value = ""; Data.putRecipe(r); render(); toast("Kommentar gespeichert");
  }
  else if (f === "shop-add") {
    const inp = $("#shop-new"); const parsed = inp.value.split(/[,;\n]/).map(parseIng).filter(x => x && !x.section);
    if (!parsed.length) return;
    addToShopping(parsed, 1, ""); inp.value = ""; render(); $("#shop-new").focus();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeOverlay(); });
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeOverlay(); });

renderNav();
initData();
})();
</script>
